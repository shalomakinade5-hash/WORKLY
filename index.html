    <script>
      // Early capture of beforeinstallprompt so Android Chrome prompt is never missed
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__WORKLY_INSTALL_PROMPT__ = e;
        window.dispatchEvent(new CustomEvent('workly:prompt-available'));
      });
    </script>
